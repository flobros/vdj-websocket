name: Build & Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build
        run: cl /nologo /O2 /W3 /EHsc /LD /I sdk DeckBridge.cpp /Fe:DeckBridge.dll /link /DLL
      - name: Stage
        run: |
          mkdir dist
          copy DeckBridge.dll dist\DeckBridge.dll
          copy DeckBridge.ini dist\DeckBridge.ini
      - uses: actions/upload-artifact@v4
        with:
          name: win64
          path: dist/

  windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build
        run: cl /nologo /O2 /W3 /EHsc /LD /I sdk DeckBridge.cpp /Fe:DeckBridge.dll /link /DLL
      - name: Stage
        run: |
          mkdir dist
          copy DeckBridge.dll dist\DeckBridge.dll
          copy DeckBridge.ini dist\DeckBridge.ini
      - uses: actions/upload-artifact@v4
        with:
          name: win32
          path: dist/

  macos-universal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Intel slice
        run: clang++ -O2 -Wall -fPIC -std=c++11 -bundle -arch x86_64 -I sdk DeckBridge.cpp -o DeckBridge_x86_64.bundle
      - name: Build ARM slice
        run: clang++ -O2 -Wall -fPIC -std=c++11 -bundle -arch arm64  -I sdk DeckBridge.cpp -o DeckBridge_arm64.bundle
      - name: Combine into Universal Binary
        run: lipo -create DeckBridge_x86_64.bundle DeckBridge_arm64.bundle -output DeckBridge.bundle
      - name: Stage
        run: |
          mkdir dist
          cp DeckBridge.bundle dist/DeckBridge.bundle
          cp DeckBridge.ini    dist/DeckBridge.ini
      - uses: actions/upload-artifact@v4
        with:
          name: mac-universal
          path: dist/

  release:
    needs: [windows-x64, windows-x86, macos-universal]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { name: win64,         path: dist/win64 }
      - uses: actions/download-artifact@v4
        with: { name: win32,         path: dist/win32 }
      - uses: actions/download-artifact@v4
        with: { name: mac-universal, path: dist/mac }

      - name: Rename for release
        run: |
          cp dist/win64/DeckBridge.dll dist/DeckBridge_win64.dll
          cp dist/win32/DeckBridge.dll dist/DeckBridge_win32.dll
          cp dist/mac/DeckBridge.bundle dist/DeckBridge_mac.bundle
          cp dist/win64/DeckBridge.ini  dist/DeckBridge.ini

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DeckBridge_win64.dll
            dist/DeckBridge_win32.dll
            dist/DeckBridge_mac.bundle
            dist/DeckBridge.ini
          body: |
            ## Installation

            Download `DeckBridge.ini` and the file for your platform, rename it to `DeckBridge.dll` / `DeckBridge.bundle`, and copy both to your VirtualDJ Plugins folder.

            | Platform | File | Plugins folder |
            |----------|------|----------------|
            | Windows 64-bit | `DeckBridge_win64.dll` → `DeckBridge.dll` | `%LOCALAPPDATA%\VirtualDJ\Plugins64\Generics\` |
            | Windows 32-bit | `DeckBridge_win32.dll` → `DeckBridge.dll` | `%LOCALAPPDATA%\VirtualDJ\Plugins\Generics\` |
            | macOS (Intel + Apple Silicon) | `DeckBridge_mac.bundle` → `DeckBridge.bundle` | `~/Library/Application Support/VirtualDJ/Plugins64/Generics/` |

            Open `DeckBridge.ini`, set `AuthToken` to a random secret, then restart VirtualDJ.

            See the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for full documentation.
