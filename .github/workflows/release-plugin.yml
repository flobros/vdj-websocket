name: Build & Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: vdj_websocket

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build DLL
        run: |
          cl /nologo /O2 /W3 /EHsc /LD /I sdk NowPlaying.cpp /Fe:NowPlaying.dll /link /DLL

      - name: Collect artifacts
        run: |
          mkdir dist
          copy NowPlaying.dll dist\NowPlaying.dll
          copy NowPlaying.ini.example dist\NowPlaying.ini.example

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NowPlaying-plugin
          path: vdj_websocket/dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vdj_websocket/dist/NowPlaying.dll
            vdj_websocket/dist/NowPlaying.ini.example
          body: |
            ## Installation

            1. Copy `NowPlaying.dll` and `NowPlaying.ini.example` to your VirtualDJ Plugins64\Generics folder.
            2. Rename `NowPlaying.ini.example` → `NowPlaying.ini` and set your `AuthToken`.
            3. Restart VirtualDJ.

            See [README](https://github.com/${{ github.repository }}/blob/main/vdj_websocket/README.md) for full documentation.
