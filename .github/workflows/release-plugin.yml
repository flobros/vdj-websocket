name: Build & Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build
        run: cl /nologo /O2 /W3 /EHsc /LD /I sdk NowPlaying.cpp /Fe:NowPlaying.dll /link /DLL
      - name: Stage
        run: |
          mkdir dist
          copy NowPlaying.dll dist\NowPlaying.dll
          copy NowPlaying.ini dist\NowPlaying.ini
      - uses: actions/upload-artifact@v4
        with:
          name: win64
          path: dist/

  windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build
        run: cl /nologo /O2 /W3 /EHsc /LD /I sdk NowPlaying.cpp /Fe:NowPlaying.dll /link /DLL
      - name: Stage
        run: |
          mkdir dist
          copy NowPlaying.dll dist\NowPlaying.dll
          copy NowPlaying.ini dist\NowPlaying.ini
      - uses: actions/upload-artifact@v4
        with:
          name: win32
          path: dist/

  macos-universal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Intel slice
        run: clang++ -O2 -Wall -fPIC -std=c++11 -bundle -arch x86_64 -I sdk NowPlaying.cpp -o NowPlaying_x86_64.bundle
      - name: Build ARM slice
        run: clang++ -O2 -Wall -fPIC -std=c++11 -bundle -arch arm64  -I sdk NowPlaying.cpp -o NowPlaying_arm64.bundle
      - name: Combine into Universal Binary
        run: lipo -create NowPlaying_x86_64.bundle NowPlaying_arm64.bundle -output NowPlaying.bundle
      - name: Stage
        run: |
          mkdir dist
          cp NowPlaying.bundle dist/NowPlaying.bundle
          cp NowPlaying.ini    dist/NowPlaying.ini
      - uses: actions/upload-artifact@v4
        with:
          name: mac-universal
          path: dist/

  release:
    needs: [windows-x64, windows-x86, macos-universal]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { name: win64,         path: dist/win64 }
      - uses: actions/download-artifact@v4
        with: { name: win32,         path: dist/win32 }
      - uses: actions/download-artifact@v4
        with: { name: mac-universal, path: dist/mac }

      - name: Rename for release
        run: |
          cp dist/win64/NowPlaying.dll dist/NowPlaying_win64.dll
          cp dist/win32/NowPlaying.dll dist/NowPlaying_win32.dll
          cp dist/mac/NowPlaying.bundle dist/NowPlaying_mac.bundle
          cp dist/win64/NowPlaying.ini  dist/NowPlaying.ini

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NowPlaying_win64.dll
            dist/NowPlaying_win32.dll
            dist/NowPlaying_mac.bundle
            dist/NowPlaying.ini
          body: |
            ## Installation

            Download `NowPlaying.ini` and the file for your platform, rename it to `NowPlaying.dll` / `NowPlaying.bundle`, and copy both to your VirtualDJ Plugins folder.

            | Platform | File | Plugins folder |
            |----------|------|----------------|
            | Windows 64-bit | `NowPlaying_win64.dll` → `NowPlaying.dll` | `%LOCALAPPDATA%\VirtualDJ\Plugins64\Generics\` |
            | Windows 32-bit | `NowPlaying_win32.dll` → `NowPlaying.dll` | `%LOCALAPPDATA%\VirtualDJ\Plugins\Generics\` |
            | macOS (Intel + Apple Silicon) | `NowPlaying_mac.bundle` → `NowPlaying.bundle` | `~/Library/Application Support/VirtualDJ/Plugins64/Generics/` |

            Open `NowPlaying.ini`, set `AuthToken` to a random secret, then restart VirtualDJ.

            See the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for full documentation.
