name: Build & Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build DLL
        run: |
          cl /nologo /O2 /W3 /EHsc /LD /I sdk NowPlaying.cpp /Fe:NowPlaying.dll /link /DLL

      - name: Collect artifacts
        run: |
          mkdir dist
          copy NowPlaying.dll dist\NowPlaying.dll
          copy NowPlaying.ini dist\NowPlaying.ini

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NowPlaying-plugin
          path: dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NowPlaying.dll
            dist/NowPlaying.ini
          body: |
            ## Installation

            1. Copy `NowPlaying.dll` and `NowPlaying.ini` to your VirtualDJ Plugins64\Generics folder:
               ```
               %LOCALAPPDATA%\VirtualDJ\Plugins64\Generics\
               ```
            2. Open `NowPlaying.ini` and set `AuthToken` to a random secret.
            3. Restart VirtualDJ.

            See the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for full documentation.
